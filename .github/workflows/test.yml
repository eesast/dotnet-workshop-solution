name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    if: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        working-directory: ./src
        run: dotnet build

      - name: Run all tests
        working-directory: ./src
        run: dotnet test -c Release
